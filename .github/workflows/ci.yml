name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quotex_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/quotex_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/quotex_test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:migrate --workspace=server

      - name: Seed markets
        run: npm run seed --workspace=server

      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # server unit tests plus the integration suite against the MySQL service
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # starts the API and Vite itself, then drives the real flows
      - name: End-to-end tests
        run: npm run e2e:ci
        env:
          JWT_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          MOCK_CHAIN_WATCHER: 'true'
          MOCK_CHAIN_CONFIRM_MS: '3000'

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quantex:ci .
