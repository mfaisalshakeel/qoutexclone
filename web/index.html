<!doctype html>
<html lang="en" class="dark">

    <meta name="theme-color" content="#0a0e17" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233d7bff'/%3E%3Cpath d='M8 21l5-6 4 3.5L24 10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- self-hosted (see src/index.css) — the four weights every above-the-fold
         page renders in body/heading/label text, so the browser can start
         fetching them before it has even parsed the stylesheet that requests
         them, and the fallback-to-webfont swap never reflows a heading whose
         width depends on which one is showing -->
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-ink-900 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
