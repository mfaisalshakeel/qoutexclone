worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Docker's embedded DNS (127.0.0.11) resolves the `app` service name to
  # every currently-running replica. A plain `proxy_pass http://app:4000`
  # resolves once, when nginx starts, and never again — scaling `app` up or
  # down would be invisible to it until a restart. `resolve` on the
  # upstream server below (nginx 1.27.3+, no commercial license needed)
  # re-resolves it continuously instead, which is what makes the
  # zero-downtime restart procedure in DEPLOY.md actually work.
  resolver 127.0.0.11 valid=2s;

  upstream app_backend {
    zone app_backend 64k;
    server app:4000 resolve;
  }

  # only ever set when the client actually asked to upgrade (a websocket
  # handshake) — an ordinary request gets a normal keep-alive connection
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # The app already compresses its own responses (gzip *and* brotli, via the
  # `compression` middleware — see the Performance task). Nginx's gzip here
  # is a second line of defence for anything that reaches it uncompressed;
  # it never re-compresses a response that already carries a
  # Content-Encoding header, so this is not double work.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;
    # everything else redirects to TLS — except the ACME HTTP-01 challenge,
    # which certbot needs to reach in plain HTTP to issue or renew a cert
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;
    http2 on;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 12m; # a KYC document upload plus its form fields

    location / {
      proxy_pass http://app_backend;
      proxy_http_version 1.1;

      # websocket upgrade — the terminal's realtime feed depends on this
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # so the app's own rate limiter and audit log see the real client, not
      # this proxy (app.ts already has `trust proxy` set for exactly this)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # a websocket connection is long-lived by design; do not time it out
      # like an ordinary request
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # if a request happens to land on a backend that just stopped (the
      # last sliver of the restart procedure's own window), try the next
      # one instead of handing the client a 502. Deliberately without
      # `non_idempotent`: nginx's default here already refuses to retry a
      # POST against a different backend — placing a trade or a withdrawal
      # request must never be silently sent twice because the first
      # attempt's connection dropped after the server had already acted on
      # it.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}
